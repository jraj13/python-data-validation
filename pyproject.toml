[project]
name = "python-data-validation"
version = "0.1.0"
description = "Reusable Parquet data validation patterns using Python and DuckDB"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3",
    "pyarrow>=20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "pre-commit>=4",
]

[project.scripts]
validate-data = "data_validation.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]